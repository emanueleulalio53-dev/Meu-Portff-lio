<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./anexos.css">
    <title>Anexos & Documentos — Portfólio</title>
</head>

<body>
    <header class="top-nav">
        <button onclick="voltarPagina()" class="btn-back">&#8592; Voltar</button>
        <div class="header-text">
            <h1>Anexos </h1>
            <p></p>
        </div>
    </header>

    <main class="container">
        <!-- CERTIFICADOS E CURSOS -->
        <section class="eixo-wrapper" data-anim data-delay="0">
            <div class="eixo-header">
                <h2>MEUS ANEXOS</h2>
            </div>

            <div class="activities-grid">
                <div class="activity-card" data-anim data-delay="0">
                    <a href="img/Trote da copa do mundo.pdf" target="_blank" class="thumb-link">
                        <img src="img/trote copa capa.jpg" alt="Trote da Copa do Mundo">
                    </a>
                    <div class="activity-details">
                        <h3>Trote da Copa do Mundo</h3>
                        <p><strong>Data:</strong> 15/12/2025</p>
                    </div>
                </div>

                <div class="activity-card" data-anim data-delay="90">
                    <a href="img/trote de personagens.pdf" target="_blank" class="thumb-link">
                        <img src="img/trote personagem capa.jpg" alt="Trote de Personagens">
                    </a>
                    <div class="activity-details">
                        <h3>Trote de Personagens</h3>
                        <p><strong>Data:</strong> 20/12/2025</p>
                    </div>
                </div>

                <div class="activity-card" data-anim data-delay="90">
                    <a href="img/Grand Prix SENAI.pdf" target="_blank" class="thumb-link">
                        <img src="img/gp senai capa.jpg" alt="Grand Prix SENAI">
                    </a>
                    <div class="activity-details">
                        <h3>Curso Complementar — Introdução ao Web Design</h3>
                        <p><strong>Tipo:</strong> Curso Extracurricular</p>
                        <p><strong>Carga Horária:</strong> 40 horas</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <script type="module" src="./auth-guard.js"></script>
</body>

</html>
